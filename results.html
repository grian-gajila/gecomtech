<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f5f4ef" />
		<title>Your results | Gecomtech</title>
		<link rel="stylesheet" href="css/index.css" />
		<link rel="stylesheet" href="css/screen.css" />
	</head>
	<body>
		<header class="site-header">
			<a class="brand" href="index.html">
				<span class="brand-mark" aria-hidden="true">G</span>
				<span>GECOMTECH <span class="brand-divider">/</span> TRIVIA</span>
			</a>
			<a class="text-link" href="selection.html">New quiz</a>
		</header>
		<main class="results-layout">
			<section class="results-summary" aria-labelledby="resultsTitle">
				<div class="section-kicker">ROUND COMPLETE</div>
				<h1 id="resultsTitle">Your results</h1>
				<p class="score-summary" id="result">Calculating your score…</p>
				<p class="result-context" id="resultContext"></p>
				<div class="score-meter" aria-hidden="true">
					<div class="score-meter-fill" id="scoreMeterFill"></div>
				</div>
				<p class="result-message" id="funny"></p>
				<div class="results-actions">
					<a id="playAgain" class="primary-button" href="selection.html">Play another round</a>
				</div>
			</section>
			<section class="results-review" aria-labelledby="reviewTitle">
				<div class="panel-heading">
					<div>
						<p class="rail-heading">ANSWER REVIEW</p>
						<h2 id="reviewTitle">See what you learned.</h2>
					</div>
					<button
						class="secondary-button"
						id="moreResults"
						type="button"
						aria-expanded="false"
						aria-controls="fullResults"
					>
						Review answers
					</button>
				</div>
				<p class="review-description">Compare your response with the correct answer for each question.</p>
				<div class="full-results" id="fullResults" hidden>
					<div class="table-scroll">
						<table class="results-table">
							<thead>
								<tr>
									<th scope="col">Question</th>
									<th scope="col">Your answer</th>
									<th scope="col">Correct answer</th>
								</tr>
							</thead>
							<tbody id="tableBody"></tbody>
						</table>
					</div>
				</div>
			</section>
		</main>
		<script type="module" src="js/results.js"></script>
	</body>
</html>
