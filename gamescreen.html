<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f5f4ef" />
		<title>Your quiz | Gecomtech</title>
		<link rel="stylesheet" href="css/index.css" />
		<link rel="stylesheet" href="css/screen.css" />
	</head>
	<body>
		<header class="site-header quiz-header">
			<a class="brand" href="selection.html">
				<span class="brand-mark" aria-hidden="true">G</span>
				<span>GECOMTECH <span class="brand-divider">/</span> TRIVIA</span>
			</a>
			<a class="text-link" href="selection.html">&larr; Change setup</a>
		</header>
		<main class="quiz-layout">
			<aside class="quiz-rail" aria-label="Quiz progress">
				<p class="section-kicker">ROUND PROGRESS</p>
				<p class="question-count" id="counterSpan">Question 1 of 1</p>
				<div
					class="progress-track"
					role="progressbar"
					aria-label="Quiz progress"
					aria-valuemin="0"
					aria-valuemax="100"
					aria-valuenow="0"
				>
					<div class="progress-fill" id="progressFill"></div>
				</div>
				<p class="quiz-topic-label">TOPIC</p>
				<p class="quiz-topic" id="quizTopic">YOUR QUIZ</p>
				<p class="rail-note">Select one answer, then check it to continue.</p>
			</aside>
			<section class="quiz-panel" aria-labelledby="question">
				<h1 class="question-title" id="question">Loading your question…</h1>
				<div class="answers" id="answers" role="group" aria-label="Answer choices">
					<button type="button" class="answer-button" data-answer-index="0"></button>
					<button type="button" class="answer-button" data-answer-index="1"></button>
					<button type="button" class="answer-button" data-answer-index="2"></button>
					<button type="button" class="answer-button" data-answer-index="3"></button>
				</div>
				<p class="answer-feedback" id="result" role="status" aria-live="polite"></p>
				<div class="quiz-actions">
					<button class="primary-button" id="btnSubmit" type="button">Check answer</button>
					<button class="primary-button" id="btnNext" type="button" hidden>
						Next question <span aria-hidden="true">&rarr;</span>
					</button>
				</div>
			</section>
		</main>
		<script type="module" src="js/question.js"></script>
	</body>
</html>
